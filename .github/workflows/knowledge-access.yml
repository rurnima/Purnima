name: Knowledge Access Checks

on:
  pull_request:
    branches:
      - feature/app-project
    paths:
      - "services/knowledge-access/**"
      - ".github/workflows/knowledge-access.yml"

permissions:
  contents: read

jobs:
  worker-checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/knowledge-access
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

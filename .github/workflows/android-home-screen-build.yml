name: Android Home Screen Build

on:
  push:
    branches:
      - feature/home-screen
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-home-screen-build.yml'

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: gradle assembleDebug

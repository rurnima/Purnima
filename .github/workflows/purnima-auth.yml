name: Purnima Device Auth Checks

on:
  pull_request:
    branches:
      - feature/app-project
    paths:
      - "services/purnima-auth/**"
      - "app/**"
      - ".github/workflows/purnima-auth.yml"
      - "build.gradle.kts"

permissions:
  contents: read

jobs:
  worker-checks:
    name: Worker typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/purnima-auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Public Worker smoke test
        env:
          AUTH_BASE_URL: https://purnima-auth.purnima.workers.dev
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "$AUTH_BASE_URL/health")"
          echo "$health" | jq -e '.service == "purnima-auth" and .status == "ok"'
          jwks="$(curl --fail --silent --show-error "$AUTH_BASE_URL/.well-known/jwks.json")"
          echo "$jwks" | jq -e '.keys | length == 1 and .[0].kty == "RSA" and .[0].alg == "RS256" and .[0].kid == "purnima-auth-rs256-v1"'

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android app
        run: gradle :app:assembleDebug

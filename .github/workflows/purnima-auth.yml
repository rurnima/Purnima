name: Purnima Device Auth Checks

on:
  pull_request:
    branches:
      - feature/app-project
    paths:
      - "services/purnima-auth/**"
      - ".github/workflows/purnima-auth.yml"

permissions:
  contents: read

jobs:
  worker-checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/purnima-auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/purnima-auth/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

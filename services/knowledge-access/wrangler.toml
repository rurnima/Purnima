name = "purnima-knowledge-access"
main = "src/index.ts"
compatibility_date = "2026-11-14"
workers_dev = true

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "purnima-knowledge-access-dev"

# Match the OIDC issuer, JWKS endpoint, and API audience used by Agent Runtime.
# Replace these placeholders with the selected identity provider before deployment.
[vars]
OIDC_ISSUER = "https://YOUR-OIDC-ISSUER/"
OIDC_JWKS_URL = "https://YOUR-OIDC-ISSUER/.well-known/jwks.json"
OIDC_AUDIENCE = "purnima-api"
